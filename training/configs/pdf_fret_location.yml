_BASE_:
  - ./tab_event_detector.yml

epoch: 18
snapshot_epoch: 1
save_dir: ../../runs/pdf-fret-location
num_classes: 1

TrainDataset:
  name: COCODataSet
  image_dir: images/train
  anno_path: annotations/train.location.json
  dataset_dir: ../../data/pdf-frets
  data_fields: [image, gt_bbox, gt_class, is_crowd]

EvalDataset:
  name: COCODataSet
  image_dir: images/val
  anno_path: annotations/val.location.json
  dataset_dir: ../../data/pdf-frets
  allow_empty: true

TestDataset:
  name: ImageFolder
  anno_path: annotations/test.location.json
  dataset_dir: ../../data/pdf-frets
