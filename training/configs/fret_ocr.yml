Global:
  model_name:
  debug: false
  use_gpu: true
  epoch_num: 8
  log_smooth_window: 20
  print_batch_step: 20
  save_model_dir: ../../runs/fret-ocr
  save_epoch_step: 1
  eval_batch_step: [0, 300]
  cal_metric_during_train: true
  pretrained_model:
  checkpoints:
  save_inference_dir: ../../models/fret-ocr-inference
  use_visualdl: false
  character_dict_path: ../../configs/fret_digits.txt
  max_text_length: &max_text_length 2
  infer_mode: false
  use_space_char: false
  distributed: false
  save_res_path: ../../runs/fret-ocr/predicts.txt
  d2s_train_image_shape: [3, 32, 100]

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0003
    warmup_epoch: 1
  regularizer:
    name: L2
    factor: 0.00003

Architecture:
  model_type: rec
  algorithm: CRNN
  Transform:
  Backbone:
    name: MobileNetV3
    scale: 0.5
    model_name: large
  Neck:
    name: SequenceEncoder
    encoder_type: rnn
    hidden_size: 96
  Head:
    name: CTCHead
    fc_decay: 0.00001

Loss:
  name: CTCLoss

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ../../data/fret-ocr
    ext_op_transform_idx: 1
    label_file_list:
      - ../../data/fret-ocr/train.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 32, 100]
      - KeepKeys:
          keep_keys:
            - image
            - label
            - length
  loader:
    shuffle: true
    batch_size_per_card: 256
    drop_last: true
    num_workers: 0

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ../../data/fret-ocr
    label_file_list:
      - ../../data/fret-ocr/val.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 32, 100]
      - KeepKeys:
          keep_keys:
            - image
            - label
            - length
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 256
    num_workers: 0
